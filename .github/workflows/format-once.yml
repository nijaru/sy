name: Format Branch Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format branch
        run: |
          cargo fmt
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/bisync_state.rs
          git commit -m "style: format bisync state codec"
          git push origin HEAD:v0.5-architecture
