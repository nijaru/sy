name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only, don't publish"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # STAGE 1: Verify version and run checks
  # ============================================================================

  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag or Cargo.toml
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${{ steps.version.outputs.version }}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)

          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match confirmed"

      - name: Check if already published to crates.io
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CRATES_VERSION=$(curl -sf https://crates.io/api/v1/crates/sy | jq -r '.versions[0].num' || echo "0.0.0")

          echo "Target version: $VERSION"
          echo "Latest on crates.io: $CRATES_VERSION"

          if [ "$VERSION" = "$CRATES_VERSION" ]; then
            echo "WARNING: Version $VERSION already published to crates.io"
            echo "Will skip crates.io publish step"
            echo "ALREADY_PUBLISHED=true" >> $GITHUB_ENV
          else
            echo "Version $VERSION is new"
            echo "ALREADY_PUBLISHED=false" >> $GITHUB_ENV
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test default and optional preservation
        run: |
          cargo test --locked
          cargo test --locked --lib --all-features

      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit

      - uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check generated manual
        run: |
          cargo install usage-cli --version 6.12.0 --locked
          cargo run --locked --bin man-gen
          git diff --exit-code man/sy.1

  verify-macos:
    name: Verify macOS semantics
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test default and optional preservation
        run: |
          cargo test --locked
          cargo test --locked --lib --all-features

  # ============================================================================
  # STAGE 2: Build binaries (parallel)
  # ============================================================================

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [verify, verify-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sy-aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sy-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build --locked --release --bin sy --features acl --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sy dist/

      - name: Create tarball
        run: |
          cd dist
          tar czf ${{ matrix.artifact_name }}.tar.gz sy
          shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz*

  build-musl:
    name: Build ${{ matrix.target }}
    needs: [verify, verify-macos]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/setup-cross-toolchain-action@v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # musl artifacts intentionally omit ACLs: no dynamic libacl dependency.
      - name: Build static release binary
        run: |
          cargo build --locked --release --bin sy --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sy dist/

      - name: Verify the artifact is fully static
        run: |
          BIN=dist/sy
          file "$BIN"
          # Standalone musl artifacts are the remote-agent distribution story
          # (#26/#28): they must run on any Linux regardless of its libc.
          if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
            echo "::error::musl artifact has a dynamic interpreter"
            readelf -l "$BIN"
            exit 1
          fi
          if readelf -d "$BIN" | grep -q "(NEEDED)"; then
            echo "::error::musl artifact has shared-library dependencies"
            readelf -d "$BIN"
            exit 1
          fi

      - name: Smoke test the static binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          work=$(mktemp -d)
          printf 'static smoke' > "$work/source"
          ./dist/sy "$work/source" "$work/copy"
          test "$(cat "$work/copy")" = "static smoke"

      - name: Create tarball
        run: |
          cd dist
          tar czf sy-${{ matrix.target }}.tar.gz sy
          sha256sum sy-${{ matrix.target }}.tar.gz > sy-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sy-${{ matrix.target }}
          path: dist/sy-${{ matrix.target }}.tar.gz*

  # ============================================================================
  # STAGE 3: Create GitHub Release (stays draft until manually published)
  # ============================================================================

  create-release:
    name: Create GitHub Release
    needs: [verify, verify-macos, build-binaries, build-musl]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Draft Release
        run: |
          gh release create ${{ needs.verify.outputs.tag }} \
            --title "${{ needs.verify.outputs.tag }}" \
            --generate-notes \
            --draft \
            artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}

  # ============================================================================
  # STAGE 4: Publish to crates.io (trusted publishing via OIDC)
  # ============================================================================

  publish-crates:
    name: Publish to crates.io
    needs: [verify, verify-macos, build-binaries, build-musl]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if already published
        id: check
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          CRATES_VERSION=$(curl -sf https://crates.io/api/v1/crates/sy | jq -r '.versions[0].num' || echo "0.0.0")
          if [ "$VERSION" = "$CRATES_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already on crates.io, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install system dependencies
        if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip != 'true'

      - name: Get crates.io token via OIDC
        if: steps.check.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish to crates.io
        if: steps.check.outputs.skip != 'true'
        run: cargo publish --token ${{ steps.crates-io-auth.outputs.token }}

  # Homebrew updates run only after public release publication; see homebrew.yml.
