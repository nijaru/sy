name: Gate Basis Identity Signatures Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Apply safety slice
        run: |
          git apply --check .github/workflows/identity-signature-1.patch
          git apply .github/workflows/identity-signature-1.patch
          git apply --check .github/workflows/identity-signature-2.patch
          git apply .github/workflows/identity-signature-2.patch
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply safety slice
        run: |
          git apply --check .github/workflows/identity-signature-1.patch
          git apply .github/workflows/identity-signature-1.patch
          git apply --check .github/workflows/identity-signature-2.patch
          git apply .github/workflows/identity-signature-2.patch
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo test

  commit:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply validated safety slice
        run: |
          git apply .github/workflows/identity-signature-1.patch
          git apply .github/workflows/identity-signature-2.patch
          cargo fmt
      - name: Commit validated slice
        run: |
          rm .github/workflows/identity-signature-once.yml
          rm .github/workflows/identity-signature-1.patch
          rm .github/workflows/identity-signature-2.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/endpoint src/protocol/signature.rs src/remote/runtime.rs src/remote/signature.rs .github/workflows/identity-signature-once.yml .github/workflows/identity-signature-1.patch .github/workflows/identity-signature-2.patch
          git commit -m "fix(remote): bind signatures to scanned basis identity"
          git push origin HEAD:v0.5-architecture
