name: Run V3 Checksum Preflight Validation

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-checksum-preflight-runner.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Apply checksum preflight patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          payload = Path('.github/workflows/ci-v3-checksum-preflight-once.yml').read_text()
          start_marker = "          from pathlib import Path\n"
          start = payload.index(start_marker)
          end = payload.index("\n          PY", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload[start:end].splitlines()
          )

          old = '''def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              if text.count(old) == 1:
                  return text.replace(old, new, 1)
              for width in (4, 8, 12):
                  prefix = ' ' * width
                  indented_old = textwrap.indent(old, prefix)
                  if text.count(indented_old) == 1:
                      return text.replace(indented_old, textwrap.indent(new, prefix), 1)
              raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')'''
          if script.count(old) != 1:
              raise SystemExit('validator helper anchor mismatch')
          script = script.replace(old, new, 1)
          exec(script)
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run checksum-focused tests
        run: cargo test --workspace --all-features checksum
      - name: Run v3 push controller tests
        run: cargo test --workspace --all-features remote::push_controller
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit validated checksum preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ci-v3-checksum-preflight-once.yml
          rm .github/workflows/ci-v3-checksum-preflight-runner.yml
          git add src/remote/push_controller.rs src/sync/v3_push.rs .github/workflows/ci-v3-checksum-preflight-once.yml .github/workflows/ci-v3-checksum-preflight-runner.yml
          git commit -m 'feat: integrate checksum comparison into v3 preflight'
          git push origin HEAD:v0.5-architecture
