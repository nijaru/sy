name: Run V3 Checksum Preflight Validation 2

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-checksum-preflight-runner2.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Apply checksum preflight patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          payload = Path('.github/workflows/ci-v3-checksum-preflight-once.yml').read_text()
          start_marker = "          from pathlib import Path\n"
          start = payload.index(start_marker)
          end = payload.index("\n          PY", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload[start:end].splitlines()
          )

          old = '''def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              if text.count(old) == 1:
                  return text.replace(old, new, 1)
              for width in (4, 8, 12):
                  prefix = ' ' * width
                  indented_old = textwrap.indent(old, prefix)
                  if text.count(indented_old) == 1:
                      return text.replace(indented_old, textwrap.indent(new, prefix), 1)
              raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')'''
          if script.count(old) != 1:
              raise SystemExit('validator helper anchor mismatch')
          script = script.replace(old, new, 1)
          exec(script)

          path = Path('src/sync/v3_push.rs')
          source = path.read_text()

          old_server = '''        let server = tokio::spawn(async move {
              let mut session = ServerRemoteSession::accept(
                  server_reader,
                  server_writer,
                  RouterConfig::default(),
              )
              .await
              .unwrap();
              let scan = session.scan_handler();
              let hash = session.hash_handler();
              let file = session.file_handler();
              let mut hashes = 0;
              let mut files = 0;
              for _ in 0..4 {
                  match session.next_request().await.unwrap().unwrap() {
                      IncomingRequest::Scan(incoming) => scan.serve(incoming).await.unwrap(),
                      IncomingRequest::Hash(incoming) => {
                          hashes += 1;
                          hash.serve(incoming).await.unwrap();
                      }
                      IncomingRequest::File(incoming) => {
                          files += 1;
                          file.serve(incoming).await.unwrap();
                      }
                      _ => panic!("unexpected checksum v3 adapter request"),
                  }
              }
              (hashes, files)
          });'''
          new_server = '''        let server = tokio::spawn(async move {
              let mut session = ServerRemoteSession::accept(
                  server_reader,
                  server_writer,
                  RouterConfig::default(),
              )
              .await
              .unwrap();
              let scan = session.scan_handler();
              let hash = session.hash_handler();
              let file = session.file_handler();
              let mut tasks = tokio::task::JoinSet::new();
              let mut hashes = 0;
              let mut files = 0;
              for _ in 0..4 {
                  match session.next_request().await.unwrap().unwrap() {
                      IncomingRequest::Scan(incoming) => {
                          let scan = scan.clone();
                          tasks.spawn(async move {
                              scan.serve(incoming)
                                  .await
                                  .map_err(|error| error.to_string())
                          });
                      }
                      IncomingRequest::Hash(incoming) => {
                          hashes += 1;
                          let hash = hash.clone();
                          tasks.spawn(async move {
                              hash.serve(incoming)
                                  .await
                                  .map_err(|error| error.to_string())
                          });
                      }
                      IncomingRequest::File(incoming) => {
                          files += 1;
                          let file = file.clone();
                          tasks.spawn(async move {
                              file.serve(incoming)
                                  .await
                                  .map(|_| ())
                                  .map_err(|error| error.to_string())
                          });
                      }
                      _ => panic!("unexpected checksum v3 adapter request"),
                  }
              }
              while let Some(joined) = tasks.join_next().await {
                  joined.unwrap().unwrap();
              }
              (hashes, files)
          });'''
          if source.count(old_server) != 1:
              raise SystemExit(f'checksum runtime server anchor mismatch: {source.count(old_server)}')
          source = source.replace(old_server, new_server, 1)

          old_dry_server = '''        let server = tokio::spawn(async move {
              let mut session = ServerRemoteSession::accept(
                  server_reader,
                  server_writer,
                  RouterConfig::default(),
              )
              .await
              .unwrap();
              let scan = session.scan_handler();
              let hash = session.hash_handler();
              for _ in 0..2 {
                  match session.next_request().await.unwrap().unwrap() {
                      IncomingRequest::Scan(incoming) => scan.serve(incoming).await.unwrap(),
                      IncomingRequest::Hash(incoming) => hash.serve(incoming).await.unwrap(),
                      _ => panic!("checksum dry-run emitted a mutation-capable request"),
                  }
              }
          });'''
          new_dry_server = '''        let server = tokio::spawn(async move {
              let mut session = ServerRemoteSession::accept(
                  server_reader,
                  server_writer,
                  RouterConfig::default(),
              )
              .await
              .unwrap();
              let scan = session.scan_handler();
              let hash = session.hash_handler();
              let mut tasks = tokio::task::JoinSet::new();
              for _ in 0..2 {
                  match session.next_request().await.unwrap().unwrap() {
                      IncomingRequest::Scan(incoming) => {
                          let scan = scan.clone();
                          tasks.spawn(async move {
                              scan.serve(incoming)
                                  .await
                                  .map_err(|error| error.to_string())
                          });
                      }
                      IncomingRequest::Hash(incoming) => {
                          let hash = hash.clone();
                          tasks.spawn(async move {
                              hash.serve(incoming)
                                  .await
                                  .map_err(|error| error.to_string())
                          });
                      }
                      _ => panic!("checksum dry-run emitted a mutation-capable request"),
                  }
              }
              while let Some(joined) = tasks.join_next().await {
                  joined.unwrap().unwrap();
              }
          });'''
          if source.count(old_dry_server) != 1:
              raise SystemExit(f'checksum dry-run server anchor mismatch: {source.count(old_dry_server)}')
          source = source.replace(old_dry_server, new_dry_server, 1)
          path.write_text(source)
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run checksum preflight controller test
        run: cargo test --workspace --all-features checksum_preflight_finishes_async_content_decisions_before_plan_return
      - name: Run checksum runtime update test
        run: cargo test --workspace --all-features checksum_mode_hashes_matches_and_transfers_only_changed_content
      - name: Run checksum dry-run test
        run: cargo test --workspace --all-features checksum_dry_run_hashes_but_emits_no_mutation_request
      - name: Run v3 push controller tests
        run: cargo test --workspace --all-features remote::push_controller
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit validated checksum preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ci-v3-checksum-preflight-once.yml
          rm .github/workflows/ci-v3-checksum-preflight-runner.yml
          rm .github/workflows/ci-v3-checksum-preflight-runner2.yml
          git add src/remote/push_controller.rs src/sync/v3_push.rs .github/workflows/ci-v3-checksum-preflight-once.yml .github/workflows/ci-v3-checksum-preflight-runner.yml .github/workflows/ci-v3-checksum-preflight-runner2.yml
          git commit -m 'feat: integrate checksum comparison into v3 preflight'
          git push origin HEAD:v0.5-architecture
