name: Gate Bounded Delta Matcher Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Apply matcher slice
        run: |
          python3 .github/workflows/delta-matcher-once.py
          python3 .github/workflows/delta-matcher-fix.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply matcher slice
        run: |
          python3 .github/workflows/delta-matcher-once.py
          python3 .github/workflows/delta-matcher-fix.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo test

  commit:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply validated matcher
        run: |
          python3 .github/workflows/delta-matcher-once.py
          python3 .github/workflows/delta-matcher-fix.py
          cargo fmt
      - name: Commit validated matcher
        run: |
          rm .github/workflows/delta-matcher-once.yml
          rm .github/workflows/delta-matcher-once.py
          rm .github/workflows/delta-matcher-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/lib.rs src/transfer .github/workflows/delta-matcher-once.yml .github/workflows/delta-matcher-once.py .github/workflows/delta-matcher-fix.py
          git commit -m "feat(transfer): add bounded streaming delta matcher"
          git push origin HEAD:v0.5-architecture
