name: Run V3 Content Hash Validation

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-content-hash-runner.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Apply content hash patch payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          payload = Path('.github/workflows/ci-v3-content-hash-once.yml').read_text()

          def extract_source(marker):
              start = payload.index(marker) + len(marker)
              end = payload.index("\n''')", start)
              return payload[start:end]

          protocol_marker = "Path('src/protocol/hash.rs').write_text(r'''"
          remote_marker = "Path('src/remote/hash.rs').write_text(r'''"
          Path('src/protocol/hash.rs').write_text(extract_source(protocol_marker))
          Path('src/remote/hash.rs').write_text(extract_source(remote_marker))

          remote_start = payload.index(remote_marker) + len(remote_marker)
          remote_end = payload.index("\n''')", remote_start) + len("\n''')")
          script_end = payload.index("\n          PY", remote_end)
          remainder = payload[remote_end:script_end]
          remainder = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in remainder.splitlines()
          )
          exec(remainder)
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run hash protocol/runtime tests
        run: cargo test --workspace --all-features hash
      - name: Run remote runtime tests
        run: cargo test --workspace --all-features remote::runtime
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit validated content hash primitive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ci-v3-content-hash-once.yml
          rm .github/workflows/ci-v3-content-hash-runner.yml
          git add src/protocol/hash.rs src/protocol/frame.rs src/protocol/mod.rs src/remote/hash.rs src/remote/mod.rs src/remote/router.rs src/remote/runtime.rs src/remote/client.rs src/remote/serve.rs .github/workflows/ci-v3-content-hash-once.yml .github/workflows/ci-v3-content-hash-runner.yml
          git commit -m 'feat: add identity-checked v3 content hash'
          git push origin HEAD:v0.5-architecture
