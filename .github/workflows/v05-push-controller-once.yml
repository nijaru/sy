name: Validate bounded v3 push controller once
on:
  push:
    paths:
      - '.github/workflows/v05-push-controller-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Wire push controller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          remote = Path('src/remote/mod.rs')
          s = remote.read_text()
          if 'pub mod push_controller;' not in s:
              s = s.replace('pub mod push;\n', 'pub mod push;\npub mod push_controller;\n', 1)
          remote.write_text(s)

          push = Path('src/remote/push.rs')
          s = push.read_text()
          import_anchor = 'use crate::engine::domain::{Entry, EntryKind, SyncOp, Timestamp};\n'
          finalize_import = 'use crate::engine::finalize_journal::FinalizeMetadata;\n'
          if finalize_import not in s:
              if import_anchor not in s:
                  raise SystemExit('push domain import anchor not found')
              s = s.replace(import_anchor, import_anchor + finalize_import, 1)

          method_anchor = '    async fn prepare_delta_basis(\n'
          method = '''    pub async fn execute_finalize(&self, metadata: FinalizeMetadata) -> Result<()> {
        let _permit = self
            .scheduler
            .acquire(ResourceRequest {
                metadata_ops: 1,
                network_writes: 1,
                ..ResourceRequest::default()
            })
            .await?;
        self.remote
            .apply_metadata(
                &metadata.path,
                metadata.kind,
                metadata.unix_mode,
                metadata.modified,
            )
            .await?;
        Ok(())
    }

'''
          if 'pub async fn execute_finalize' not in s:
              if method_anchor not in s:
                  raise SystemExit('prepare_delta_basis anchor not found')
              s = s.replace(method_anchor, method + method_anchor, 1)
          push.write_text(s)
          PY
          cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Push controller tests
        run: cargo test --workspace --all-features --locked remote::push_controller::tests
      - name: Push lowering regression
        run: cargo test --workspace --all-features --locked remote::push::tests
      - name: Handle concurrency regression
        run: cargo test --workspace --all-features --locked remote::runtime::tests::session_runtime_multiplexes_two_ordered_scans
      - name: Commit validated source
        shell: bash
        run: |
          git rm .github/workflows/v05-push-controller-once.yml
          git add src/remote/mod.rs src/remote/push.rs src/remote/push_controller.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): orchestrate bounded preflighted pushes'
          git push origin HEAD:v0.5-architecture
