name: Validate v3 adapter module boundary once

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/v3-push-adapter-once-v4.yml'

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PATCH_RUN_ID: 33284430899

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: actions/download-artifact@v4
        with:
          name: v3-push-patch-v2
          run-id: ${{ env.PATCH_RUN_ID }}
          github-token: ${{ github.token }}
      - run: git apply v3-push.patch
      - name: Apply adapter corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/sync/v3_push.rs')
          text = path.read_text()
          replacements = {
              'use crate::endpoint::local_entry_scan::local_entry_stream;': 'use sy::endpoint::local_entry_scan::local_entry_stream;',
              'use crate::engine::delete_plan::{DeletePlanError, DeletePolicy};': 'use sy::engine::delete_plan::{DeletePlanError, DeletePolicy};',
              'use crate::engine::planner::{ComparisonMode, ComparisonPolicy};': 'use sy::engine::planner::{ComparisonMode, ComparisonPolicy};',
              'use crate::engine::scan::{EntryMetadataRequest, ScanRequest};': 'use sy::engine::scan::{EntryMetadataRequest, ScanRequest};',
              'use crate::engine::scheduler::{ResourceBudget, Scheduler};': 'use sy::engine::scheduler::{ResourceBudget, Scheduler};',
              'use crate::protocol::Operation;': 'use sy::protocol::Operation;',
              'use crate::remote::push::RemotePushExecutor;': 'use sy::remote::push::RemotePushExecutor;',
              'use crate::remote::push_controller::{': 'use sy::remote::push_controller::{',
              'use crate::remote::router::RouterConfig;': 'use sy::remote::router::RouterConfig;',
              'use crate::remote::runtime::ClientRemoteHandle;': 'use sy::remote::runtime::ClientRemoteHandle;',
              'use crate::remote::ssh::SshRemoteSession;': 'use sy::remote::ssh::SshRemoteSession;',
              'use crate::transfer::delta::BasisIndexLimits;': 'use sy::transfer::delta::BasisIndexLimits;',
              'use crate::remote::runtime::{ClientRemoteSession, IncomingRequest, ServerRemoteSession};': 'use sy::remote::runtime::{ClientRemoteSession, IncomingRequest, ServerRemoteSession};',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'module-boundary anchor missing: {old}')
              text = text.replace(old, new, 1)

          old = '''    let mut budget = ResourceBudget::default();\n    budget.active_files = active_files;\n'''
          new = '''    let budget = ResourceBudget {\n        active_files,\n        ..ResourceBudget::default()\n    };\n'''
          if old not in text:
              raise SystemExit('ResourceBudget anchor missing')
          text = text.replace(old, new, 1)

          old = '''    ssh_config: &crate::ssh::config::SshConfig,\n    config: &SyncConfig,\n'''
          new = '''    host: &str,\n    user: &Option<String>,\n    config: &SyncConfig,\n'''
          if old not in text:
              raise SystemExit('run SSH signature anchor missing')
          text = text.replace(old, new, 1)

          old = '''    let started = Instant::now();\n    let session = SshRemoteSession::connect(\n        ssh_config,\n'''
          new = '''    let started = Instant::now();\n    let ssh_config = resolve_v3_ssh_config(host, user)?;\n    let session = SshRemoteSession::connect(\n        &ssh_config,\n'''
          if old not in text:
              raise SystemExit('run SSH body anchor missing')
          text = text.replace(old, new, 1)

          marker = '''async fn execute_with_handle(\n'''
          helper = '''fn resolve_v3_ssh_config(\n    host: &str,\n    user: &Option<String>,\n) -> Result<sy::ssh::config::SshConfig> {\n    if let Some(user) = user {\n        Ok(sy::ssh::config::SshConfig {\n            hostname: host.to_string(),\n            user: user.clone(),\n            ..Default::default()\n        })\n    } else {\n        sy::ssh::config::parse_ssh_config(host)\n    }\n}\n\n'''
          if marker not in text:
              raise SystemExit('execute helper anchor missing')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          session = Path('src/sync/session.rs')
          text = session.read_text()
          old = '''        let ssh_config = resolve_ssh_config(host, user)?;\n        super::v3_push::run(\n            self.source.root(),\n            dest_root,\n            &ssh_config,\n            &self.config,\n            self.scan_options,\n        )\n'''
          new = '''        super::v3_push::run(\n            self.source.root(),\n            dest_root,\n            host,\n            user,\n            &self.config,\n            self.scan_options,\n        )\n'''
          if old not in text:
              raise SystemExit('session adapter call anchor missing')
          session.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features sync::v3_push -- --nocapture
      - run: cargo test --all-features remote::push_controller -- --nocapture

  commit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: actions/download-artifact@v4
        with:
          name: v3-push-patch-v2
          run-id: ${{ env.PATCH_RUN_ID }}
          github-token: ${{ github.token }}
      - run: git apply v3-push.patch
      - name: Apply validated corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/sync/v3_push.rs')
          text = path.read_text()
          replacements = {
              'use crate::endpoint::local_entry_scan::local_entry_stream;': 'use sy::endpoint::local_entry_scan::local_entry_stream;',
              'use crate::engine::delete_plan::{DeletePlanError, DeletePolicy};': 'use sy::engine::delete_plan::{DeletePlanError, DeletePolicy};',
              'use crate::engine::planner::{ComparisonMode, ComparisonPolicy};': 'use sy::engine::planner::{ComparisonMode, ComparisonPolicy};',
              'use crate::engine::scan::{EntryMetadataRequest, ScanRequest};': 'use sy::engine::scan::{EntryMetadataRequest, ScanRequest};',
              'use crate::engine::scheduler::{ResourceBudget, Scheduler};': 'use sy::engine::scheduler::{ResourceBudget, Scheduler};',
              'use crate::protocol::Operation;': 'use sy::protocol::Operation;',
              'use crate::remote::push::RemotePushExecutor;': 'use sy::remote::push::RemotePushExecutor;',
              'use crate::remote::push_controller::{': 'use sy::remote::push_controller::{',
              'use crate::remote::router::RouterConfig;': 'use sy::remote::router::RouterConfig;',
              'use crate::remote::runtime::ClientRemoteHandle;': 'use sy::remote::runtime::ClientRemoteHandle;',
              'use crate::remote::ssh::SshRemoteSession;': 'use sy::remote::ssh::SshRemoteSession;',
              'use crate::transfer::delta::BasisIndexLimits;': 'use sy::transfer::delta::BasisIndexLimits;',
              'use crate::remote::runtime::{ClientRemoteSession, IncomingRequest, ServerRemoteSession};': 'use sy::remote::runtime::{ClientRemoteSession, IncomingRequest, ServerRemoteSession};',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'module-boundary anchor missing: {old}')
              text = text.replace(old, new, 1)
          old = '''    let mut budget = ResourceBudget::default();\n    budget.active_files = active_files;\n'''
          new = '''    let budget = ResourceBudget {\n        active_files,\n        ..ResourceBudget::default()\n    };\n'''
          if old not in text:
              raise SystemExit('ResourceBudget anchor missing')
          text = text.replace(old, new, 1)
          old = '''    ssh_config: &crate::ssh::config::SshConfig,\n    config: &SyncConfig,\n'''
          new = '''    host: &str,\n    user: &Option<String>,\n    config: &SyncConfig,\n'''
          if old not in text:
              raise SystemExit('run SSH signature anchor missing')
          text = text.replace(old, new, 1)
          old = '''    let started = Instant::now();\n    let session = SshRemoteSession::connect(\n        ssh_config,\n'''
          new = '''    let started = Instant::now();\n    let ssh_config = resolve_v3_ssh_config(host, user)?;\n    let session = SshRemoteSession::connect(\n        &ssh_config,\n'''
          if old not in text:
              raise SystemExit('run SSH body anchor missing')
          text = text.replace(old, new, 1)
          marker = '''async fn execute_with_handle(\n'''
          helper = '''fn resolve_v3_ssh_config(\n    host: &str,\n    user: &Option<String>,\n) -> Result<sy::ssh::config::SshConfig> {\n    if let Some(user) = user {\n        Ok(sy::ssh::config::SshConfig {\n            hostname: host.to_string(),\n            user: user.clone(),\n            ..Default::default()\n        })\n    } else {\n        sy::ssh::config::parse_ssh_config(host)\n    }\n}\n\n'''
          if marker not in text:
              raise SystemExit('execute helper anchor missing')
          path.write_text(text.replace(marker, helper + marker, 1))
          session = Path('src/sync/session.rs')
          text = session.read_text()
          old = '''        let ssh_config = resolve_ssh_config(host, user)?;\n        super::v3_push::run(\n            self.source.root(),\n            dest_root,\n            &ssh_config,\n            &self.config,\n            self.scan_options,\n        )\n'''
          new = '''        super::v3_push::run(\n            self.source.root(),\n            dest_root,\n            host,\n            user,\n            &self.config,\n            self.scan_options,\n        )\n'''
          if old not in text:
              raise SystemExit('session adapter call anchor missing')
          session.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/sync/mod.rs src/sync/config.rs src/sync/session.rs src/sync/v3_push.rs src/remote/push_controller.rs
          git commit -m 'feat(remote): route supported pushes through v3'
          git push origin HEAD:v0.5-architecture
