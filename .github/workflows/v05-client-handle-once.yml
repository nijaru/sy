name: Validate v3 client handle once
on:
  push:
    paths:
      - '.github/workflows/v05-client-handle-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Wire client handle and concurrency test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/remote/runtime.rs')
          s = p.read_text()
          marker = '#[path = "mutation.rs"]\nmod mutation;\n'
          addition = marker + '#[path = "client.rs"]\nmod client;\npub use client::ClientRemoteHandle;\n'
          if 'mod client;' not in s:
              s = s.replace(marker, addition, 1)
          old = '''        let first = session.scan(request).await.unwrap();
        let second = session.scan(request).await.unwrap();
        let (first, second) = tokio::join!(collect_paths(first), collect_paths(second));
        server.await.unwrap();
'''
          new = '''        let first_handle = session.request_handle();
        let second_handle = first_handle.clone();
        let first = tokio::spawn(async move {
            collect_paths(first_handle.scan(request).await.unwrap()).await
        });
        let second = tokio::spawn(async move {
            collect_paths(second_handle.scan(request).await.unwrap()).await
        });
        let (first, second) = tokio::join!(first, second);
        let first = first.unwrap();
        let second = second.unwrap();
        server.await.unwrap();
'''
          if old not in s:
              raise SystemExit('expected scan test block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Targeted runtime tests
        run: cargo test --workspace --all-features --locked remote::runtime::tests::session_runtime_multiplexes_two_ordered_scans
      - name: Commit validated source
        shell: bash
        run: |
          git rm .github/workflows/v05-client-handle-once.yml
          git add src/remote/runtime.rs src/remote/client.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): wire cloneable v3 request handle'
          git push origin HEAD:v0.5-architecture
