name: Normalize Bisync Store Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove recovery panic and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/engine/bisync_store.rs")
          text = path.read_text()
          start = text.index("        if current.is_some_and")
          end = text.index("\n\n        if current.map", start)
          replacement = (
              "        if let Some(pointer) = current {\n"
              "            if pointer.generation == marker.target_generation {\n"
              "                self.verify_pointer(pointer)?;\n"
              "                return Ok(RecoveryState::Committed(marker));\n"
              "            }\n"
              "        }"
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/bisync_store.rs
          git commit -m "fix(engine): keep bisync recovery panic-free"
          git push origin HEAD:v0.5-architecture
