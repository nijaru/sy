name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Stage 1: Fast checks (parallel, fail fast on lint)
  # ==========================================================================

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # The runner image ships a third-party Chrome apt source whose mirror
        # intermittently fails hash verification; it is irrelevant to this
        # build, so it is removed before update to keep apt deterministic.
        run: |
          # glob without extension: the runner ships both .list and
          # deb822 .sources forms depending on image generation
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  static-musl:
    name: Static musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/setup-cross-toolchain-action@v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Verify the artifact is fully static
        run: |
          BIN=target/${{ matrix.target }}/release/sy
          file "$BIN"
          # Standalone musl artifacts must run on any Linux regardless of its
          # libc: no dynamic interpreter and no shared-library dependencies.
          if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
            echo "::error::musl artifact has a dynamic interpreter"
            readelf -l "$BIN"
            exit 1
          fi
          if readelf -d "$BIN" | grep -q "(NEEDED)"; then
            echo "::error::musl artifact has shared-library dependencies"
            readelf -d "$BIN"
            exit 1
          fi
      - name: Smoke test the static binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN=target/${{ matrix.target }}/release/sy
          work=$(mktemp -d)
          printf 'static smoke' > "$work/source"
          "$BIN" "$work/source" "$work/copy"
          test "$(cat "$work/copy")" = "static smoke"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  man:
    name: Man Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --bin man-gen
      - name: Check man page is up to date
        run: git diff --exit-code man/sy.1 || (echo "Man page out of date. Run 'cargo run --bin man-gen' and commit." && exit 1)

  # ==========================================================================
  # Stage 2: Tests (after lint passes)
  # ==========================================================================

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # The runner image ships a third-party Chrome apt source whose mirror
        # intermittently fails hash verification; it is irrelevant to this
        # build, so it is removed before update to keep apt deterministic.
        run: |
          # glob without extension: the runner ships both .list and
          # deb822 .sources forms depending on image generation
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
        timeout-minutes: 15

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
        timeout-minutes: 15
