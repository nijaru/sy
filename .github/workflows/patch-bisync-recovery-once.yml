name: Patch Bisync Recovery Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch interrupted recovery preparation
        env:
          INSERTION_B64: 
          TEST_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path("src/engine/bisync_store.rs")
          text = path.read_text()
          insertion = base64.b64decode(os.environ["INSERTION_B64"]).decode()
          test = base64.b64decode(os.environ["TEST_B64"]).decode()
          anchor = "    /// Start a mutation transaction by durably recording base -> target before\n"
          if anchor not in text:
              raise SystemExit("begin_run anchor not found")
          text = text.replace(anchor, insertion + anchor, 1)
          test_anchor = "    #[test]\n    #[cfg(unix)]\n    fn generation_advances_monotonically() {\n"
          if test_anchor not in text:
              raise SystemExit("test anchor not found")
          path.write_text(text.replace(test_anchor, test + test_anchor, 1))
          PY
          cargo fmt
          cargo test --lib engine::bisync_store --all-features
          cargo clippy --lib --all-features -- -D warnings
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/bisync_store.rs
          git commit -m "fix(engine): prepare interrupted bisync resync safely"
          git push origin HEAD:v0.5-architecture
