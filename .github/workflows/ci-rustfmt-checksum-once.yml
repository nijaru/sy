name: Format Landed Checksum Slice Once

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-rustfmt-checksum-once.yml'

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          rm .github/workflows/ci-rustfmt-checksum-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sync/v3_push.rs .github/workflows/ci-rustfmt-checksum-once.yml
          git commit -m 'style: format v3 checksum integration'
          git push origin HEAD:v0.5-architecture
