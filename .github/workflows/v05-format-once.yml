name: Format v0.5 metadata slice once

on:
  push:
    branches:
      - v0.5-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format and remove one-shot workflow
        run: |
          cargo fmt --all
          rm .github/workflows/v05-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format metadata transfer slice"
          git push origin HEAD:v0.5-architecture
