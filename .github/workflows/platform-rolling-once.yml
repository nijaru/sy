name: Gate Platform Rolling Slice Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Apply slice
        run: python3 .github/workflows/platform-rolling-once.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply slice
        run: python3 .github/workflows/platform-rolling-once.py
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo test

  commit:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply validated slice
        run: |
          python3 .github/workflows/platform-rolling-once.py
          cargo fmt
      - name: Commit validated slice
        run: |
          rm .github/workflows/platform-rolling-once.yml
          rm .github/workflows/platform-rolling-once.patch
          rm .github/workflows/platform-rolling-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/engine src/remote/mod.rs src/remote/path.rs src/remote/signature.rs .github/workflows/platform-rolling-once.yml .github/workflows/platform-rolling-once.patch .github/workflows/platform-rolling-once.py
          git commit -m "feat(remote): scope platforms and add rolling checksum"
          git push origin HEAD:v0.5-architecture
