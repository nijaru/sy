name: Validate V3 Content Hash Once

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-content-hash-once.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Add bounded whole-file hash protocol and runtime
        run: |
          python3 - <<'PY'
