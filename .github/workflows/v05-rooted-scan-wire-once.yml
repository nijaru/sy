name: Wire rooted v3 scan once

on:
  push:
    branches:
      - v0.5-architecture

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply wiring
        run: python3 scripts/v05_rooted_scan_wire.py
      - name: Format and commit
        run: |
          cargo fmt --all
          rm scripts/v05_rooted_scan_wire.py
          rm .github/workflows/v05-rooted-scan-wire-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(remote): pin scan authority to session root"
          git push origin HEAD:v0.5-architecture
