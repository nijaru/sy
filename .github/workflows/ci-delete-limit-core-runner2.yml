name: Validate Typed Delete Limit Core Runner 2

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-delete-limit-core-runner2.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Apply complete typed delete-limit core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/ci-delete-limit-core-once.yml').read_text()
          start_marker = "          from pathlib import Path\n"
          start = workflow.index(start_marker)
          end = workflow.index("\n          PY", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )

          old = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              if "\\n" in old:
                  lines = old.splitlines()
                  pattern = "(?m)" + "\\n".join(
                      r"^[ \\t]*" + re.escape(line.strip()) + r"[ \\t]*$"
                      for line in lines
                  )
                  matches = list(re.finditer(pattern, text))
                  if len(matches) == 1:
                      match = matches[0]
                      return text[:match.start()] + new + text[match.end():]
              raise SystemExit(f'{label}: expected one anchor, found {count}')'''
          if script.count(old) != 1:
              raise SystemExit('replace_once helper anchor mismatch')
          script = script.replace(old, new, 1)
          exec(script)

          # Serialize the typed policy only at the legacy streaming protocol boundary.
          path = Path('src/sync/config.rs')
          text = path.read_text()
          anchor = '\n#[derive(Debug, Clone, Default)]\npub struct ComparisonConfig'
          formatter = '''
          pub fn format_delete_limit(limit: DeleteLimit) -> String {
              match limit {
                  DeleteLimit::Unlimited => "0".to_string(),
                  DeleteLimit::Percentage(value) => format!("{value}%"),
                  DeleteLimit::Count(value) => value.to_string(),
              }
          }

          #[derive(Debug, Clone, Default)]
          pub struct ComparisonConfig'''
          if text.count(anchor) != 1:
              raise SystemExit('config comparison anchor mismatch')
          text = text.replace(anchor, '\n' + formatter, 1)
          text = text.replace(
              '        assert_eq!(parse_delete_limit("0").unwrap(), DeleteLimit::Unlimited);',
              '        assert_eq!(parse_delete_limit("0").unwrap(), DeleteLimit::Unlimited);\n        assert_eq!(format_delete_limit(DeleteLimit::Unlimited), "0");\n        assert_eq!(format_delete_limit(DeleteLimit::Percentage(50)), "50%");\n        assert_eq!(format_delete_limit(DeleteLimit::Count(1000)), "1000");',
              1,
          )
          path.write_text(text)

          # Old batch planner: enforce the same typed policy instead of percentage-only helpers.
          path = Path('src/sync/mod.rs')
          text = path.read_text()
          helper_anchor = 'impl<T: Transport + \'static> SyncEngine<T> {'
          helper = '''fn enforce_configured_delete_limit(
              delete: &DeleteMode,
              eligible_destination_entries: usize,
              delete_candidates: usize,
          ) -> Result<()> {
              let Some(limit) = delete.limit() else {
                  return Ok(());
              };
              let eligible_destination_entries = u64::try_from(eligible_destination_entries)
                  .map_err(|_| crate::error::SyncError::Config("eligible delete count exceeds u64 range".to_string()))?;
              let delete_candidates = u64::try_from(delete_candidates)
                  .map_err(|_| crate::error::SyncError::Config("delete candidate count exceeds u64 range".to_string()))?;
              let policy = sy::engine::delete_plan::DeletePolicy {
                  limit,
                  force: delete.is_forced(),
              };
              match sy::engine::delete_plan::enforce_delete_policy(
                  policy,
                  eligible_destination_entries,
                  delete_candidates,
              ) {
                  Ok(()) => Ok(()),
                  Err(sy::engine::delete_plan::DeletePlanError::ThresholdExceeded {
                      eligible_destination_entries,
                      delete_candidates,
                      threshold,
                  }) => {
                      let percentage = if eligible_destination_entries == 0 {
                          0.0
                      } else {
                          delete_candidates as f64 * 100.0 / eligible_destination_entries as f64
                      };
                      Err(crate::error::SyncError::DeletionThresholdExceeded {
                          percentage,
                          threshold,
                      })
                  }
                  Err(sy::engine::delete_plan::DeletePlanError::CountExceeded {
                      delete_candidates,
                      limit,
                  }) => Err(crate::error::SyncError::DeletionCountExceeded {
                      delete_candidates,
                      limit,
                  }),
                  Err(other) => Err(crate::error::SyncError::Io(std::io::Error::other(
                      other.to_string(),
                  ))),
              }
          }

          impl<T: Transport + 'static> SyncEngine<T> {'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('sync engine impl anchor mismatch')
          text = text.replace(helper_anchor, helper, 1)
          safety = re.compile(
              r'\n\s*// Check threshold: prevent mass deletion\n.*?\n\s*// CRITICAL SAFETY NET:',
              re.S,
          )
          replacement = '''
                  if let Err(error) = enforce_configured_delete_limit(
                      &self.config.delete,
                      dest_file_count,
                      deletions.len(),
                  ) {
                      tracing::error!(%error, "refusing unsafe deletion plan");
                      if !self.config.quiet {
                          eprintln!("ERROR: {error}");
                          eprintln!("Use --force-delete to skip safety checks (dangerous!)");
                      }
                      return Err(error);
                  }

                  // CRITICAL SAFETY NET:'''
          text, count = safety.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'legacy batch safety block: expected one match, got {count}')
          text = text.replace('                let _force_delete = self.config.delete.is_forced();\n', '', 1)
          text = text.replace('                let _delete_threshold = self.config.delete.threshold();\n', '', 1)
          path.write_text(text)

          # Legacy streaming session keeps its string protocol but derives it from DeleteLimit.
          path = Path('src/sync/session.rs')
          text = path.read_text()
          old = '''    if let Some(ref max_delete) = config.max_delete {
              streaming = streaming.with_max_delete(max_delete.clone());
          }
          '''
          new = '''    if let Some(limit) = config.delete.limit() {
              streaming = streaming.with_max_delete(crate::sync::config::format_delete_limit(limit));
          }
          '''
          if text.count(old) != 1:
              # structural fallback for indentation inherited from YAML extraction
              pattern = re.compile(
                  r'(?m)^\s*if let Some\(ref max_delete\) = config\.max_delete \{\n\s*streaming = streaming\.with_max_delete\(max_delete\.clone\(\)\);\n\s*\}\n'
              )
              text, count = pattern.subn(new, text, count=1)
              if count != 1:
                  raise SystemExit('session max-delete serialization anchor mismatch')
          else:
              text = text.replace(old, new, 1)
          path.write_text(text)

          # Controller test policies follow the new core representation.
          path = Path('src/remote/push_controller.rs')
          text = path.read_text()
          old_import = 'use crate::engine::delete_plan::{DeletePlan, DeletePlanError, DeletePolicy, DeleteTracker};'
          new_import = 'use crate::engine::delete_plan::{DeleteLimit, DeletePlan, DeletePlanError, DeletePolicy, DeleteTracker};'
          if text.count(old_import) != 1:
              raise SystemExit('push controller delete import mismatch')
          text = text.replace(old_import, new_import, 1)
          text, count = re.subn(
              r'(?m)^(\s*)threshold: (\d+),$',
              r'\1limit: DeleteLimit::Percentage(\2),',
              text,
          )
          if count != 6:
              raise SystemExit(f'push controller numeric policy conversions: expected 6, got {count}')
          path.write_text(text)
          PY
      - name: Run cargo fmt --all
        run: cargo fmt --all
      - name: Run cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run typed delete-limit tests
        run: |
          cargo test --workspace --all-features delete_limit_tests
          cargo test --workspace --all-features count_limit_
          cargo test --workspace --all-features protected_candidate_parent_is_not_counted_against_delete_limit
          cargo test --workspace --all-features remote::push_controller
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit typed delete-limit core
        run: |
          git fetch origin v0.5-architecture
          test "$(git rev-parse origin/v0.5-architecture)" = "$(git rev-parse HEAD)" || { echo 'branch advanced during validation'; exit 1; }
          rm -f .github/workflows/ci-delete-limit-core-once.yml .github/workflows/ci-delete-limit-core-runner.yml .github/workflows/ci-delete-limit-core-runner2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/delete_plan.rs src/sync/config.rs src/sync/mod.rs src/main.rs src/sync/reconcile.rs src/sync/session.rs src/error.rs src/sync/v3_push.rs src/remote/push_controller.rs .github/workflows
          git commit -m 'refactor: type delete safety limits'
          git push origin HEAD:v0.5-architecture
