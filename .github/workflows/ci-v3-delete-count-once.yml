name: Validate V3 Absolute Delete Limits Once

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-delete-count-once.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Enable absolute delete limits in v3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('src/sync/v3_push.rs')
          text = path.read_text()

          old_import = 'use sy::engine::delete_plan::{DeleteLimit, DeletePlanError, DeletePolicy};\n'
          new_import = 'use sy::engine::delete_plan::{DeletePlanError, DeletePolicy};\n'
          if text.count(old_import) != 1:
              raise SystemExit('delete-plan import anchor mismatch')
          text = text.replace(old_import, new_import, 1)

          fallback = (
              '    if matches!(\n'
              '        &config.delete,\n'
              '        DeleteMode::Enabled {\n'
              '            limit: DeleteLimit::Count(_),\n'
              '            ..\n'
              '        }\n'
              '    ) {\n'
              '        return Some("absolute delete limits are not yet enabled by the v3 adapter");\n'
              '    }\n\n'
          )
          if text.count(fallback) != 1:
              raise SystemExit('absolute delete fallback anchor mismatch')
          text = text.replace(fallback, '', 1)

          test_import = '    use sy::engine::domain::Timestamp;\n'
          if text.count(test_import) != 1:
              raise SystemExit('test import anchor mismatch')
          text = text.replace(
              test_import,
              test_import + '    use sy::engine::delete_plan::DeleteLimit;\n',
              1,
          )

          routing_pattern = re.compile(
              r'    #\[test\]\n'
              r'    fn absolute_delete_limit_remains_typed_fallback_until_adapter_slice\(\) \{\n'
              r'.*?'
              r'    \}\n',
              re.S,
          )
          new_routing = textwrap.indent(textwrap.dedent('''
          #[test]
          fn absolute_delete_limit_maps_to_v3_without_fallback() {
              let mut config = supported_config();
              config.delete = DeleteMode::Enabled {
                  limit: DeleteLimit::Count(1),
                  force: false,
              };
              assert_eq!(legacy_fallback_reason(&config, ScanOptions::default()), None);
              assert_eq!(
                  delete_policy(&config.delete),
                  Some(DeletePolicy {
                      limit: DeleteLimit::Count(1),
                      force: false,
                  })
              );
          }
          ''').lstrip('\n'), '    ')
          text, count = routing_pattern.subn(new_routing, text, count=1)
          if count != 1:
              raise SystemExit(f'absolute delete routing test: expected one match, got {count}')

          anchor = (
              '    #[cfg(unix)]\n'
              '    #[tokio::test]\n'
              '    async fn filtered_delete_preserves_excluded_subtree_and_removes_in_scope_entry() {\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('runtime insertion anchor mismatch')

          regressions = textwrap.indent(textwrap.dedent('''
          #[cfg(unix)]
          #[tokio::test]
          async fn absolute_delete_limit_rejects_before_mutation_requests() {
              let source_root = TempDir::new().unwrap();
              let destination_root = TempDir::new().unwrap();
              std::fs::write(destination_root.path().join("first"), b"first").unwrap();
              std::fs::write(destination_root.path().join("second"), b"second").unwrap();

              let (client_io, server_io) = tokio::io::duplex(64 * 1024);
              let (client_reader, client_writer) = tokio::io::split(client_io);
              let (server_reader, server_writer) = tokio::io::split(server_io);
              let server = tokio::spawn(async move {
                  let mut session =
                      ServerRemoteSession::accept(server_reader, server_writer, RouterConfig::default())
                          .await
                          .unwrap();
                  let scan = session.scan_handler();
                  match session.next_request().await.unwrap().unwrap() {
                      IncomingRequest::Scan(incoming) => scan.serve(incoming).await.unwrap(),
                      _ => panic!("absolute delete limit emitted a mutation-capable request before preflight rejection"),
                  }
              });

              let session = ClientRemoteSession::connect(
                  client_reader,
                  client_writer,
                  Operation::Push,
                  destination_root.path(),
                  RouterConfig::default(),
              )
              .await
              .unwrap();
              let mut config = supported_config();
              config.delete = DeleteMode::Enabled {
                  limit: DeleteLimit::Count(1),
                  force: false,
              };
              let error = execute_with_handle(
                  source_root.path(),
                  session.request_handle(),
                  &config,
                  ScanOptions::default(),
              )
              .await
              .unwrap_err();

              server.await.unwrap();
              assert!(matches!(
                  error,
                  SyncError::DeletionCountExceeded {
                      delete_candidates: 2,
                      limit: 1,
                  }
              ));
              assert!(destination_root.path().join("first").exists());
              assert!(destination_root.path().join("second").exists());
          }

          #[cfg(unix)]
          #[tokio::test]
          async fn absolute_delete_limit_allows_exact_boundary() {
              let source_root = TempDir::new().unwrap();
              let destination_root = TempDir::new().unwrap();
              std::fs::write(destination_root.path().join("first"), b"first").unwrap();
              std::fs::write(destination_root.path().join("second"), b"second").unwrap();

              let (client_io, server_io) = tokio::io::duplex(64 * 1024);
              let (client_reader, client_writer) = tokio::io::split(client_io);
              let (server_reader, server_writer) = tokio::io::split(server_io);
              let server = tokio::spawn(async move {
                  let mut session =
                      ServerRemoteSession::accept(server_reader, server_writer, RouterConfig::default())
                          .await
                          .unwrap();
                  let scan = session.scan_handler();
                  let mutation = session.mutation_handler();
                  let mut mutations = 0_usize;
                  for _ in 0..3 {
                      match session.next_request().await.unwrap().unwrap() {
                          IncomingRequest::Scan(incoming) => scan.serve(incoming).await.unwrap(),
                          IncomingRequest::Mutation(incoming) => {
                              mutations += 1;
                              mutation.serve(incoming).await.unwrap();
                          }
                          _ => panic!("unexpected absolute delete limit request"),
                      }
                  }
                  mutations
              });

              let session = ClientRemoteSession::connect(
                  client_reader,
                  client_writer,
                  Operation::Push,
                  destination_root.path(),
                  RouterConfig::default(),
              )
              .await
              .unwrap();
              let mut config = supported_config();
              config.delete = DeleteMode::Enabled {
                  limit: DeleteLimit::Count(2),
                  force: false,
              };
              let stats = execute_with_handle(
                  source_root.path(),
                  session.request_handle(),
                  &config,
                  ScanOptions::default(),
              )
              .await
              .unwrap();

              assert_eq!(server.await.unwrap(), 2);
              assert_eq!(stats.files_deleted, 2);
              assert!(!destination_root.path().join("first").exists());
              assert!(!destination_root.path().join("second").exists());
          }

          ''').lstrip('\n'), '    ')
          text = text.replace(anchor, regressions + anchor, 1)
          path.write_text(text)
          PY
      - name: Run cargo fmt --all
        run: cargo fmt --all
      - name: Run cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run v3 absolute delete-limit tests
        run: |
          cargo test --workspace --all-features absolute_delete_limit_maps_to_v3_without_fallback
          cargo test --workspace --all-features absolute_delete_limit_rejects_before_mutation_requests
          cargo test --workspace --all-features absolute_delete_limit_allows_exact_boundary
      - name: Run v3 adapter tests
        run: cargo test --workspace --all-features sync::v3_push
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit v3 absolute delete-limit support
        run: |
          git fetch origin v0.5-architecture
          test "$(git rev-parse origin/v0.5-architecture)" = "$(git rev-parse HEAD)" || { echo 'branch advanced during validation'; exit 1; }
          rm -f .github/workflows/ci-v3-delete-count-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sync/v3_push.rs .github/workflows
          git commit -m 'feat: enforce absolute delete limits in v3'
          git push origin HEAD:v0.5-architecture
