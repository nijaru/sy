name: Validate semantic plan journal once
on:
  push:
    paths:
      - '.github/workflows/v05-plan-journal-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Wire semantic plan journal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          journal = Path('src/engine/plan_journal.rs')
          s = journal.read_text()
          s = s.replace('const RECORD_LEN_BYTES: u64 = 4;\n', '')
          journal.write_text(s)
          engine = Path('src/engine/mod.rs')
          s = engine.read_text()
          if 'pub mod plan_journal;' not in s:
              s += 'pub mod plan_journal;\n'
          engine.write_text(s)
          PY
          cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Plan journal tests
        run: cargo test --workspace --all-features --locked engine::plan_journal::tests
      - name: Commit validated source
        shell: bash
        run: |
          git rm .github/workflows/v05-plan-journal-once.yml
          git add src/engine/mod.rs src/engine/plan_journal.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(engine): spool semantic plans to disk'
          git push origin HEAD:v0.5-architecture
