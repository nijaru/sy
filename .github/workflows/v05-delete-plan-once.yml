name: Validate exact delete preflight once
on:
  push:
    paths:
      - '.github/workflows/v05-delete-plan-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Wire delete plan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('src/engine/mod.rs')
          s = engine.read_text()
          if 'mod delete_journal;' not in s:
              s = s.replace('pub mod domain;\n', 'pub(crate) mod delete_journal;\npub mod delete_plan;\npub mod domain;\n', 1)
          engine.write_text(s)
          reconcile = Path('src/sync/reconcile.rs')
          s = reconcile.read_text()
          s = s.replace('#[path = "../engine/delete_journal.rs"]\nmod delete_journal;\n\n', '', 1)
          s = s.replace('use delete_journal::{DeleteJournal, DeleteJournalReader, DeleteKind};\n', 'use sy::engine::delete_journal::{DeleteJournal, DeleteJournalReader, DeleteKind};\n', 1)
          reconcile.write_text(s)
          PY
          cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Delete plan tests
        run: cargo test --workspace --all-features --locked engine::delete_plan::tests
      - name: Existing local delete regression
        run: cargo test --workspace --all-features --locked sync::reconcile::tests::delete_preflight_removes_only_destination_only_entries
      - name: Commit validated source
        shell: bash
        run: |
          git rm .github/workflows/v05-delete-plan-once.yml
          git add src/engine/mod.rs src/engine/delete_plan.rs src/sync/reconcile.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(engine): add exact bounded delete preflight'
          git push origin HEAD:v0.5-architecture
