name: Validate Typed Delete Limit Core Runner

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-delete-limit-core-runner.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Apply typed delete-limit core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci-delete-limit-core-once.yml').read_text()
          start_marker = "          from pathlib import Path\n"
          start = workflow.index(start_marker)
          end = workflow.index("\n          PY", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          )

          old = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              if "\\n" in old:
                  lines = old.splitlines()
                  pattern = "(?m)" + "\\n".join(
                      r"^[ \\t]*" + re.escape(line.strip()) + r"[ \\t]*$"
                      for line in lines
                  )
                  matches = list(re.finditer(pattern, text))
                  if len(matches) == 1:
                      match = matches[0]
                      return text[:match.start()] + new + text[match.end():]
              raise SystemExit(f'{label}: expected one anchor, found {count}')'''
          if script.count(old) != 1:
              raise SystemExit('replace_once helper anchor mismatch')
          script = script.replace(old, new, 1)
          exec(script)
          PY
      - name: Run cargo fmt --all
        run: cargo fmt --all
      - name: Run cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: Run cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run typed delete-limit tests
        run: |
          cargo test --workspace --all-features delete_limit_tests
          cargo test --workspace --all-features count_limit_
          cargo test --workspace --all-features protected_candidate_parent_is_not_counted_against_delete_limit
          cargo test --workspace --all-features absolute_delete_limit_remains_typed_fallback_until_adapter_slice
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit typed delete-limit core
        run: |
          rm -f .github/workflows/ci-delete-limit-core-once.yml .github/workflows/ci-delete-limit-core-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/delete_plan.rs src/sync/config.rs src/sync/mod.rs src/main.rs src/sync/reconcile.rs src/error.rs src/sync/v3_push.rs .github/workflows
          git commit -m 'refactor: type delete safety limits'
          git push origin HEAD:v0.5-architecture
