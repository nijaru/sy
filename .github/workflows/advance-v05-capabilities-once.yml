name: Advance v0.5 Capabilities Once

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply slice
        run: python3 .github/workflows/advance-v05-capabilities-once.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply slice
        run: python3 .github/workflows/advance-v05-capabilities-once.py
      - run: cargo fmt --check
      - run: cargo test

  commit:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply validated slice
        run: python3 .github/workflows/advance-v05-capabilities-once.py
      - run: cargo fmt
      - name: Commit validated slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/remote/mod.rs agent-context/ai/0.5-design-audit.md agent-context/ai/0.5-rewrite.md
          git commit -m "feat(remote): advertise secure rolling signatures on Unix"
          git push origin HEAD:v0.5-architecture
