name: Validate reverse finalize journal once
on:
  push:
    paths:
      - '.github/workflows/v05-finalize-journal-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Wire finalize journal
        run: |
          python3 -c "from pathlib import Path; p=Path('src/engine/mod.rs'); s=p.read_text(); s=s.replace('pub mod domain;\n', 'pub mod domain;\npub mod finalize_journal;\n', 1) if 'pub mod finalize_journal;' not in s else s; p.write_text(s)"
          cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Finalize journal tests
        run: cargo test --workspace --all-features --locked engine::finalize_journal::tests
      - name: Commit validated source
        shell: bash
        run: |
          git rm .github/workflows/v05-finalize-journal-once.yml
          git add src/engine/mod.rs src/engine/finalize_journal.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(engine): spool metadata finalization in reverse'
          git push origin HEAD:v0.5-architecture
