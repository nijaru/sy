name: Validate v3 push commit ordering once
on:
  push:
    paths:
      - '.github/workflows/v05-push-runtime-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Preflight directory finalization and add runtime ordering test
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def decoded(value: str) -> str:
              return base64.b64decode(value).decode()

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          fragments = {
              'plan_old': 'cHViIHN0cnVjdCBSZW1vdGVQdXNoUGxhbiB7CiAgICByZWFkZXI6IFBsYW5Kb3VybmFsUmVhZGVyLAogICAgb3BlcmF0aW9uczogdTY0LAogICAgZGVsZXRlOiBPcHRpb248RGVsZXRlUGxhbj4sCn0=',
              'plan_new': 'cHViIHN0cnVjdCBSZW1vdGVQdXNoUGxhbiB7CiAgICByZWFkZXI6IFBsYW5Kb3VybmFsUmVhZGVyLAogICAgZmluYWxpemU6IEZpbmFsaXplSm91cm5hbFJlYWRlciwKICAgIG9wZXJhdGlvbnM6IHU2NCwKICAgIGRlbGV0ZTogT3B0aW9uPERlbGV0ZVBsYW4+LAogICAgZXhlY3V0aW9uX3BvbGljeTogUmVtb3RlUHVzaFBvbGljeSwKfQ==',
              'init_old': 'ICAgIGxldCBtdXQgcmVjb25jaWxlciA9IE9yZGVyZWRSZWNvbmNpbGVyOjpuZXcoc291cmNlLCBkZXN0aW5hdGlvbik7CiAgICBsZXQgbXV0IGpvdXJuYWwgPSBQbGFuSm91cm5hbDo6bmV3KCkuYXdhaXQ/OwogICAgbGV0IG11dCBkZWxldGUgPSBtYXRjaCBkZWxldGVfcG9saWN5IHs=',
              'init_new': '',
              'sourceonly_old': 'ICAgICAgICAgICAgUmVjb25jaWxlSXRlbTo6U291cmNlT25seShzb3VyY2UpID0+IHsKICAgICAgICAgICAgICAgIGlmIGxldCBTb21lKGRlbGV0ZSkgPSAmbXV0IGRlbGV0ZSB7',
              'sourceonly_new': 'ICAgICAgICAgICAgUmVjb25jaWxlSXRlbTo6U291cmNlT25seShzb3VyY2UpID0+IHsKICAgICAgICAgICAgICAgIGFwcGVuZF9kaXJlY3RvcnlfZmluYWxpemUoJm11dCBmaW5hbGl6ZSwgJnNvdXJjZSwgTm9uZSwgcG9saWN5KS5hd2FpdD87CiAgICAgICAgICAgICAgICBpZiBsZXQgU29tZShkZWxldGUpID0gJm11dCBkZWxldGUgew==',
              'matched_old': 'ICAgICAgICAgICAgUmVjb25jaWxlSXRlbTo6TWF0Y2hlZCB7CiAgICAgICAgICAgICAgICBzb3VyY2UsCiAgICAgICAgICAgICAgICBkZXN0aW5hdGlvbiwKICAgICAgICAgICAgfSA9PiB7CiAgICAgICAgICAgICAgICBpZiBsZXQgU29tZShkZWxldGUpID0gJm11dCBkZWxldGUgew==',
              'matched_new': '',
              'return_old': 'ICAgIE9rKFJlbW90ZVB1c2hQbGFuIHsKICAgICAgICByZWFkZXI6IGpvdXJuYWwuc2VhbCgpLmF3YWl0PywKICAgICAgICBvcGVyYXRpb25zLAogICAgICAgIGRlbGV0ZSwKICAgIH0p',
              'return_new': 'ICAgIE9rKFJlbW90ZVB1c2hQbGFuIHsKICAgICAgICByZWFkZXI6IGpvdXJuYWwuc2VhbCgpLmF3YWl0PywKICAgICAgICBmaW5hbGl6ZTogZmluYWxpemUuc2VhbCgpLmF3YWl0PywKICAgICAgICBvcGVyYXRpb25zLAogICAgICAgIGRlbGV0ZSwKICAgICAgICBleGVjdXRpb25fcG9saWN5LAogICAgfSk=',
              'controller_old': '',
              'controller_new': '',
              'destructure_old': 'ICAgICAgICBsZXQgUmVtb3RlUHVzaFBsYW4gewogICAgICAgICAgICBtdXQgcmVhZGVyLAogICAgICAgICAgICBvcGVyYXRpb25zLAogICAgICAgICAgICBkZWxldGUsCiAgICAgICAgfSA9IHBsYW47',
              'destructure_new': 'ICAgICAgICBsZXQgUmVtb3RlUHVzaFBsYW4gewogICAgICAgICAgICBtdXQgcmVhZGVyLAogICAgICAgICAgICBtdXQgZmluYWxpemUsCiAgICAgICAgICAgIG9wZXJhdGlvbnMsCiAgICAgICAgICAgIGRlbGV0ZSwKICAgICAgICAgICAgZXhlY3V0aW9uX3BvbGljeSwKICAgICAgICB9ID0gcGxhbjs=',
              'finalize_create_old': 'ICAgICAgICBsZXQgbXV0IGZpbmFsaXplID0gRmluYWxpemVKb3VybmFsOjpuZXcoKS5hd2FpdD87CiAgICAgICAgbGV0IG11dCB3b3JrZXJzID0gSm9pblNldDo6bmV3KCk7',
              'finalize_create_new': 'ICAgICAgICBsZXQgbXV0IHdvcmtlcnMgPSBKb2luU2V0OjpuZXcoKTs=',
              'lower_old': '',
              'lower_new': 'ICAgICAgICAgICAgbGV0IFNvbWUobWFpbikgPSBsb3dlcl9zeW5jX29wKG9wZXJhdGlvbiwgZXhlY3V0aW9uX3BvbGljeSk/Lm1haW4gZWxzZSB7',
              'seal_old': 'ICAgICAgICBsZXQgbXV0IGZpbmFsaXplID0gZmluYWxpemUuc2VhbCgpLmF3YWl0PzsKICAgICAgICB3aGlsZSBsZXQgU29tZShtZXRhZGF0YSkgPSBmaW5hbGl6ZS5uZXh0KCkuYXdhaXQ/IHs=',
              'seal_new': 'ICAgICAgICB3aGlsZSBsZXQgU29tZShtZXRhZGF0YSkgPSBmaW5hbGl6ZS5uZXh0KCkuYXdhaXQ/IHs=',
              'helper_old': '',
              'invalid_err_old': 'ICAgICNbZXJyb3IoImxvd2VyZWQgZmluYWxpemUgd29yayB3YXMgbm90IGEgbWV0YWRhdGEgYWN0aW9uIildCiAgICBJbnZhbGlkRmluYWxpemVXb3JrLAoK',
              'old_test': '',
              'helper_new': '',
              'unit_new': '',
              'runtime_new': ''
          }

          path = Path('src/remote/push_controller.rs')
          text = path.read_text()
          text = replace_one(
              text,
              'use crate::engine::finalize_journal::{FinalizeJournal, FinalizeJournalError, FinalizeMetadata};',
              'use crate::engine::finalize_journal::{\n    FinalizeJournal, FinalizeJournalError, FinalizeJournalReader, FinalizeMetadata,\n};',
              'finalize imports',
          )
          text = replace_one(text, 'use crate::engine::work::WorkItem;\n', '', 'unused WorkItem import')
          text = replace_one(text, decoded(fragments['invalid_err_old']), '', 'invalid finalize error')
          for old_key, new_key, label in [
              ('plan_old', 'plan_new', 'plan fields'),
              ('init_old', 'init_new', 'preflight journal init'),
              ('sourceonly_old', 'sourceonly_new', 'source-only finalize'),
              ('matched_old', 'matched_new', 'matched finalize'),
              ('return_old', 'return_new', 'preflight return'),
              ('controller_old', 'controller_new', 'controller policy ownership'),
              ('destructure_old', 'destructure_new', 'plan destructure'),
              ('finalize_create_old', 'finalize_create_new', 'runtime finalize journal removal'),
              ('lower_old', 'lower_new', 'execution lowering'),
              ('seal_old', 'seal_new', 'preflight finalize replay'),
          ]:
              text = replace_one(text, decoded(fragments[old_key]), decoded(fragments[new_key]), label)
          text = replace_one(text, decoded(fragments['helper_old']), decoded(fragments['helper_new']), 'directory finalize helper')
          text = replace_one(
              text,
              '/// Source-backed semantic work and exact destination-only deletion candidates\n/// are derived from the same ordered stream. Returning this value means the',
              '/// Source-backed semantic work, requested directory final metadata, and exact\n/// destination-only deletion candidates are derived from the same ordered stream.\n/// Returning this value means the',
              'plan docs',
          )
          text = replace_one(
              text,
              '/// directory metadata is journaled and replayed child-before-parent only after\n/// main work completes.',
              '/// directory metadata is preflighted into a reverse journal and replayed\n/// child-before-parent only after main work and reverse deletes complete.',
              'controller docs',
          )
          text = replace_one(
              text,
              decoded(fragments['old_test']),
              decoded(fragments['unit_new']) + decoded(fragments['runtime_new']),
              'controller finalize tests',
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Remote push controller tests
        run: cargo test --workspace --all-features --locked remote::push_controller::tests
      - name: Remote push lowering tests
        run: cargo test --workspace --all-features --locked remote::push::tests
      - name: Commit validated source
        shell: bash
        run: |
          git rm .github/workflows/v05-push-runtime-once.yml
          git add src/remote/push_controller.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): preserve parent metadata across v3 commit'
          git push origin HEAD:v0.5-architecture
