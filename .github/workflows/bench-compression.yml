name: Compression Benchmark

on:
  push:
    branches: [v0.5-architecture]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark v3 compression candidates
        run: cargo bench --bench compress_bench -- --noplot
        timeout-minutes: 15
