name: Fix rooted v3 scan once

on:
  push:
    branches:
      - v0.5-architecture

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Add scanner error forwarding helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/rooted_fs/scan.rs')
          text = path.read_text()
          marker = '\nfn walk_directory(\n'
          helper = '''
fn send_error(
    sender: &tokio::sync::mpsc::Sender<Result<Entry, BoxError>>,
    error: RootedScanError,
) {
    let _ = sender.blocking_send(Err(Box::new(error) as BoxError));
}

'''
          if 'fn send_error(' not in text:
              if marker not in text:
                  raise SystemExit('scan worker marker missing')
              text = text.replace(marker, '\n' + helper + 'fn walk_directory(\n', 1)
              path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/v05-rooted-scan-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(remote): forward rooted scan worker errors"
          git push origin HEAD:v0.5-architecture
