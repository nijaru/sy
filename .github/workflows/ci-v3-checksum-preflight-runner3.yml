name: Run V3 Checksum Preflight Validation 3

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-checksum-preflight-runner3.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Apply checksum preflight patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          payload = Path('.github/workflows/ci-v3-checksum-preflight-once.yml').read_text()
          start_marker = "          from pathlib import Path\n"
          start = payload.index(start_marker)
          end = payload.index("\n          PY", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in payload[start:end].splitlines()
          )

          old = '''def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              if text.count(old) == 1:
                  return text.replace(old, new, 1)
              for width in (4, 8, 12):
                  prefix = ' ' * width
                  indented_old = textwrap.indent(old, prefix)
                  if text.count(indented_old) == 1:
                      return text.replace(indented_old, textwrap.indent(new, prefix), 1)
              raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')'''
          if script.count(old) != 1:
              raise SystemExit('validator helper anchor mismatch')
          script = script.replace(old, new, 1)
          exec(script)

          path = Path('src/sync/v3_push.rs')
          source = path.read_text()

          def replace_server_with_production_dispatcher(source, test_name):
              test_start = source.index(f'async fn {test_name}()')
              server_start = source.index('let server = tokio::spawn(async move {', test_start)
              session_start = source.index('let session = ClientRemoteSession::connect(', server_start)
              server_end = source.rfind('});', server_start, session_start)
              if server_end < server_start:
                  raise SystemExit(f'{test_name}: could not locate server task boundary')
              line_start = source.rfind('\n', 0, server_start) + 1
              indent = source[line_start:server_start]
              replacement = textwrap.indent(textwrap.dedent('''\
              let server = tokio::spawn(async move {
                  sy::remote::serve::serve_transport(
                      server_reader,
                      server_writer,
                      RouterConfig::default(),
                  )
                  .await
                  .unwrap();
              });'''), indent)
              return source[:server_start] + replacement + source[server_end + 3:]

          source = replace_server_with_production_dispatcher(
              source,
              'checksum_mode_hashes_matches_and_transfers_only_changed_content',
          )
          marker = 'assert_eq!(server.await.unwrap(), (2, 1));'
          if source.count(marker) != 1:
              raise SystemExit(f'checksum runtime join anchor mismatch: {source.count(marker)}')
          source = source.replace(marker, 'drop(session);\n        server.await.unwrap();', 1)

          source = replace_server_with_production_dispatcher(
              source,
              'checksum_dry_run_hashes_but_emits_no_mutation_request',
          )
          dry_start = source.index('async fn checksum_dry_run_hashes_but_emits_no_mutation_request()')
          dry_end = source.index('async fn adapter_executes_real_v3_runtime_and_maps_stats()', dry_start)
          dry_segment = source[dry_start:dry_end]
          marker = 'server.await.unwrap();'
          if dry_segment.count(marker) != 1:
              raise SystemExit(f'checksum dry-run join anchor mismatch: {dry_segment.count(marker)}')
          dry_segment = dry_segment.replace(marker, 'drop(session);\n        server.await.unwrap();', 1)
          source = source[:dry_start] + dry_segment + source[dry_end:]
          path.write_text(source)
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run checksum preflight controller test
        run: cargo test --workspace --all-features checksum_preflight_finishes_async_content_decisions_before_plan_return
      - name: Run checksum runtime update test
        run: cargo test --workspace --all-features checksum_mode_hashes_matches_and_transfers_only_changed_content
      - name: Run checksum dry-run test
        run: cargo test --workspace --all-features checksum_dry_run_hashes_but_emits_no_mutation_request
      - name: Run v3 push controller tests
        run: cargo test --workspace --all-features remote::push_controller
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit validated checksum preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ci-v3-checksum-preflight-once.yml
          rm .github/workflows/ci-v3-checksum-preflight-runner.yml
          rm .github/workflows/ci-v3-checksum-preflight-runner2.yml
          rm .github/workflows/ci-v3-checksum-preflight-runner3.yml
          git add src/remote/push_controller.rs src/sync/v3_push.rs .github/workflows/ci-v3-checksum-preflight-once.yml .github/workflows/ci-v3-checksum-preflight-runner.yml .github/workflows/ci-v3-checksum-preflight-runner2.yml .github/workflows/ci-v3-checksum-preflight-runner3.yml
          git commit -m 'feat: integrate checksum comparison into v3 preflight'
          git push origin HEAD:v0.5-architecture
