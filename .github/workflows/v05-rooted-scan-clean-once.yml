name: Clean rooted v3 scan once

on:
  push:
    branches:
      - v0.5-architecture

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5-architecture
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply cleanup
        run: python3 .github/v05_rooted_scan_cleanup.py
      - name: Format and commit
        run: |
          cargo fmt --all
          rm -f .github/v05_rooted_scan_cleanup.py
          rm -f .github/workflows/v05-rooted-scan-clean-once.yml
          rm -f .github/workflows/v05-rooted-scan-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(remote): make rooted scan portable"
          git push origin HEAD:v0.5-architecture
