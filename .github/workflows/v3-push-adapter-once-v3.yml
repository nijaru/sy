name: Validate v3 push adapter fix once

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/v3-push-adapter-once-v3.yml'

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PATCH_RUN_ID: 33284430899

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: actions/download-artifact@v4
        with:
          name: v3-push-patch-v2
          run-id: ${{ env.PATCH_RUN_ID }}
          github-token: ${{ github.token }}
      - run: git apply v3-push.patch
      - name: Apply strict-Clippy fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sync/v3_push.rs')
          text = path.read_text()
          old = '''    let mut budget = ResourceBudget::default();\n    budget.active_files = active_files;\n'''
          new = '''    let budget = ResourceBudget {\n        active_files,\n        ..ResourceBudget::default()\n    };\n'''
          if old not in text:
              raise SystemExit('ResourceBudget anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features sync::v3_push -- --nocapture
      - run: cargo test --all-features remote::push_controller -- --nocapture

  commit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - uses: actions/download-artifact@v4
        with:
          name: v3-push-patch-v2
          run-id: ${{ env.PATCH_RUN_ID }}
          github-token: ${{ github.token }}
      - run: git apply v3-push.patch
      - name: Apply validated fix and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sync/v3_push.rs')
          text = path.read_text()
          old = '''    let mut budget = ResourceBudget::default();\n    budget.active_files = active_files;\n'''
          new = '''    let budget = ResourceBudget {\n        active_files,\n        ..ResourceBudget::default()\n    };\n'''
          if old not in text:
              raise SystemExit('ResourceBudget anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/sync/mod.rs src/sync/config.rs src/sync/session.rs src/sync/v3_push.rs src/remote/push_controller.rs
          git commit -m 'feat(remote): route supported pushes through v3'
          git push origin HEAD:v0.5-architecture
