name: Validate V3 Existing-Only Adapter Once

on:
  push:
    branches: [v0.5-architecture]
    paths:
      - '.github/workflows/ci-v3-existing-adapter-once.yml'

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-architecture
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt,clippy
      - name: Route existing-only through v3 adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/sync/v3_push.rs')
          text = path.read_text()

          replacements = [
              (
                  'fallback',
                  '    if config.existing {\n        return Some("existing-only selection is not yet implemented by v3");\n    }\n',
                  '',
              ),
              (
                  'routing test',
                  '    #[tokio::test]\n    async fn filtered_source_error_aborts_preflight_before_delete_plan() {',
                  '    #[test]\n    fn existing_only_selection_maps_to_v3_without_fallback() {\n        let mut config = supported_config();\n        config.existing = true;\n\n        assert_eq!(\n            legacy_fallback_reason(&config, ScanOptions::default()),\n            None\n        );\n        assert!(comparison_policy(&config).existing_only);\n    }\n\n    #[tokio::test]\n    async fn filtered_source_error_aborts_preflight_before_delete_plan() {',
              ),
              (
                  'runtime test',
                  '    #[cfg(unix)]\n    #[tokio::test]\n    async fn adapter_executes_real_v3_runtime_and_maps_stats() {',
                  '    #[cfg(unix)]\n    #[tokio::test]\n    async fn existing_only_skips_missing_source_entries_and_updates_matches() {\n        let source_root = TempDir::new().unwrap();\n        let destination_root = TempDir::new().unwrap();\n        std::fs::write(source_root.path().join("matched"), b"new").unwrap();\n        std::fs::write(source_root.path().join("missing"), b"missing").unwrap();\n        std::fs::write(destination_root.path().join("matched"), b"older").unwrap();\n\n        let (client_io, server_io) = tokio::io::duplex(64 * 1024);\n        let (client_reader, client_writer) = tokio::io::split(client_io);\n        let (server_reader, server_writer) = tokio::io::split(server_io);\n        let server = tokio::spawn(async move {\n            let mut session =\n                ServerRemoteSession::accept(server_reader, server_writer, RouterConfig::default())\n                    .await\n                    .unwrap();\n            let scan = session.scan_handler();\n            let file = session.file_handler();\n            for _ in 0..2 {\n                match session.next_request().await.unwrap().unwrap() {\n                    IncomingRequest::Scan(incoming) => scan.serve(incoming).await.unwrap(),\n                    IncomingRequest::File(incoming) => {\n                        file.serve(incoming).await.unwrap();\n                    }\n                    _ => panic!("unexpected existing-only v3 adapter request"),\n                }\n            }\n        });\n\n        let session = ClientRemoteSession::connect(\n            client_reader,\n            client_writer,\n            Operation::Push,\n            destination_root.path(),\n            RouterConfig::default(),\n        )\n        .await\n        .unwrap();\n        let mut config = supported_config();\n        config.existing = true;\n        let stats = execute_with_handle(\n            source_root.path(),\n            session.request_handle(),\n            &config,\n            ScanOptions::default(),\n        )\n        .await\n        .unwrap();\n\n        server.await.unwrap();\n        assert_eq!(stats.files_created, 0);\n        assert_eq!(stats.files_updated, 1);\n        assert_eq!(stats.files_skipped, 1);\n        assert!(!destination_root.path().join("missing").exists());\n        assert_eq!(\n            std::fs::read(destination_root.path().join("matched")).unwrap(),\n            b"new"\n        );\n    }\n\n    #[cfg(unix)]\n    #[tokio::test]\n    async fn adapter_executes_real_v3_runtime_and_maps_stats() {',
              ),
          ]

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run existing-only focused tests
        run: cargo test --workspace --all-features existing_only
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Commit validated adapter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ci-v3-existing-adapter-once.yml
          git add src/sync/v3_push.rs .github/workflows/ci-v3-existing-adapter-once.yml
          git commit -m 'feat: route existing-only pushes through v3'
          git push origin HEAD:v0.5-architecture
