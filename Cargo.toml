[package]
name = "sy"
version = "0.4.1"
edition = "2021"
authors = ["Nick Russo <nijaru7@gmail.com>"]
description = "Fast, modern file sync — rsync's mental model, Rust performance, sane defaults"
repository = "https://github.com/nijaru/sy"
license = "MIT"
keywords = ["rsync", "sync", "file-transfer", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
    "tmp/",
    "ai/",
    "scripts/",
    "man/",
    "templates/",
    ".claude/",
    ".github/",
    "benches/",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "deny.toml",
]

[features]
default = ["ssh"]
acl = ["exacl"]
ssh = []
watch = ["dep:notify"]

[lints.clippy]
double_must_use = "allow"

[dependencies]
# CLI & Config
usage = { package = "usage-rs", version = "6.12", features = ["completions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime (Phase 2: used for transport abstraction)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "process", "time", "sync", "signal"] }
async-trait = "0.1"

# Filesystem
ignore = "0.4"
regex = "1"
filetime = "0.2"
tempfile = "3"
glob = "0.3"
notify = { version = "6.0", optional = true }
libc = "0.2"
errno = "0.3"

# Progress & Logging
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Hash functions (for future phases, included now to avoid rebuild churn)
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1"
hex = "0.4"

# Compression
zstd = "0.13"  # Level 3: 8.7 GB/s, best ratio
lz4_flex = "0.13"  # 23 GB/s, faster but lower ratio

# Parallel processing
rayon = "1.10"

# SSH - Optional feature (OpenSSH is invoked as an external process; no
# embedded SSH stack is linked)
dirs = "5"
futures = "0.3.31"
bytes = "1.11.1"
bitflags = "2.10.0"
unicode-normalization = "0.1"

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.3"
exacl = { version = "0.12", optional = true }


[dev-dependencies]
criterion = "0.5"
tempfile = "3"
proptest = "1"
usage = { package = "usage-rs", version = "6.12", features = ["test", "completions"] }

[[bench]]
name = "sync_bench"
harness = false

[[bench]]
name = "comparative_bench"
harness = false

[[bench]]
name = "delta_bench"
harness = false

[[bench]]
name = "compress_bench"
harness = false


[[bin]]
name = "sy-bench-gen"
path = "src/bin/sy-bench-gen.rs"


[[test]]
name = "sync_basic"
path = "tests/sync/basic.rs"

[[test]]
name = "sync_filters"
path = "tests/sync/filters.rs"

[[test]]
name = "sync_metadata"
path = "tests/sync/metadata.rs"

[[test]]
name = "sync_comparison"
path = "tests/sync/comparison.rs"

[[test]]
name = "sync_edge_cases"
path = "tests/sync/edge_cases.rs"

[[test]]
name = "sync_scale"
path = "tests/sync/scale.rs"


[[test]]
name = "sync_ssh"
path = "tests/sync/ssh.rs"

[[test]]
name = "sync_archive"
path = "tests/sync/archive.rs"

[[test]]
name = "sync_change_ratio"
path = "tests/sync/change_ratio.rs"

[[test]]
name = "sync_compression"
path = "tests/sync/compression.rs"

[[test]]
name = "sync_property"
path = "tests/sync/property.rs"

